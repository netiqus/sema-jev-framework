[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sema-jev-framework"
version = "0.2.0a3"
description = "Typed semantic gates for Python applications, powered by Jev"
readme = "README.en.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Typing :: Typed"]

[project.urls]
Homepage = "https://github.com/netiqus/sema-jev-framework"
Documentation = "https://github.com/netiqus/sema-jev-framework/blob/main/README.md"
Issues = "https://github.com/netiqus/sema-jev-framework/issues"
Source = "https://github.com/netiqus/sema-jev-framework"

[project.scripts]
sema-jev = "sema_jev.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
    "mypy>=1.15,<2",
    "build>=1.2,<2",
    "twine>=6,<7",
    "pytest-timeout>=2.4,<3",
]

[tool.hatch.build.targets.wheel]
core-metadata-version = "2.4"
packages = ["src/sema_jev"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = ["/src", "/tests", "/examples", "/policies", "/evals", "/scripts", "/docs", "/LICENSE", "/README*.md", "/CHANGELOG*.md", "/CONTRIBUTING*.md", "/pyproject.toml", "/uv.lock", "/dev.sh"]
exclude = ["/.claude", "/AGENTS.md", "/CLAUDE.md", "**/__pycache__", "**/*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 30
timeout_method = "thread"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/sema_jev"]

[tool.coverage.run]
source = ["sema_jev"]
branch = true
