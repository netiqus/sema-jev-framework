name: Draft release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag (for example v0.2.0a1)
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Configure isolated runtime
        shell: bash
        run: |
          echo "SEMA_OUT_DIR=${RUNNER_TEMP}/sema-runtime" >> "$GITHUB_ENV"
          echo "UV_CACHE_DIR=${RUNNER_TEMP}/uv-cache" >> "$GITHUB_ENV"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.10.2'
          enable-cache: false
      - name: Verify selected ref and existing version tag
        run: python -B scripts/verify_release.py
      - name: Verify and build
        run: python -B scripts/dev.py check
      - name: Create prerelease draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_TAG" "$SEMA_OUT_DIR"/artifacts/dist/* --draft --prerelease --verify-tag --title "$RELEASE_TAG" --notes-file docs/release-notes.en.md
